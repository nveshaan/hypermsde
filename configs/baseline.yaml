# Settings for scripts/run_baseline.py: an inference-only baseline (configs/baselines/<method>.yaml) on raw images.
defaults:
  - _self_
  - baselines: anomalyclip   # not a key of this file: `baselines` is the config group, pick it with baselines=adaclip
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled

hydra:
  run:
    dir: .
  sweep:
    dir: .
    subdir: ""
  output_subdir: null
  job:
    chdir: false

data_root: ${oc.env:HMSDE_DATA,data}   # embeddings dir; only labels.npy is read, to select the same samples as run_hypermsde.py
modality: chest
dataset: null   # null runs every dataset listed in configs/datasets/<modality>.yaml
seed: 42
cap: 10000
load_chunk: 256   # images held in memory at once
# Few-shot baselines (requires_support): number of normal samples (label 0, drawn with support_seed) taken out of
# the data and passed to the method's fit(). The same draw as scripts/run_hypermsde.py. 0 = zero-shot.
support: 0
support_seed: ${seed}

# Class name AdaCLIP prompts with, per modality.
class_names:
  chest: chest X-ray
  fundus: retinal fundus image
  mri: brain MRI
  oct: retinal OCT

mlflow:
  tracking_uri: sqlite:///experiments/mlflow.db
  experiment_name: baseline
