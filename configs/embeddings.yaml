# Runtime and model settings for scripts/generate_embeddings.py.
defaults:
  - _self_
  - datasets/raw_chest@data.chest
  - datasets/raw_fundus@data.fundus
  - datasets/raw_mri@data.mri
  - datasets/raw_oct@data.oct
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled

hydra:
  run:
    dir: .
  sweep:
    dir: .
    subdir: ""
  output_subdir: null
  job:
    chdir: false

output_root: ${oc.env:DELTA_DATA,data}
modalities: [chest, fundus, mri, oct]
modality: null
encoder: null
dataset: null
overwrite: false
text_only: false   # true: embed the normal/abnormal prompts below instead of the images

# Prompt ensemble for the cosine-softmax detector (scripts/run_detector.py detector=cosine_text):
# every template filled with every state of the modality's class name, averaged per state.
text:
  class_names:
    chest: chest X-ray
    fundus: retinal fundus image
    mri: brain MRI
    oct: retinal OCT
  states:
    normal: ["normal {}", "healthy {}", "{} without abnormality", "{} with no disease"]
    abnormal: ["abnormal {}", "unhealthy {}", "{} with an abnormality", "{} with disease"]
  templates:
    - "a photo of a {}."
    - "an image of a {}."
    - "a medical image of a {}."
    - "this is a {}."

runtime:
  batch_size: 16
  num_workers: 0
  device: auto
  seed: 42
  normalize: true
  norm_eps: 1e-12
  output_dtype: float32
  labels_dtype: int64

encoders:
  MedImageInsight:
    hf_repo: lion-ai/MedImageInsights
    model_subdirectory: 2024.09.27
    vision_model_name: medimageinsigt-v1.0.0.pt
    language_model_name: language_model.pth

  MedSigLIP:
    model_name: google/medsiglip-448
    token_env: HF_TOKEN

  BiomedCLIP:
    model_name: hf-hub:microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224

  UniMedCLIP:
    git_repository: https://github.com/mbzuai-oryx/UniMed-CLIP.git
    repository_dir: ${oc.env:DELTA_THIRD_PARTY,.third_party}/UniMed-CLIP
    model_name: ViT-B-16-quickgelu
    text_encoder_name: microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract
    hf_repo: UzairK/unimed-clip-vit-b16
    hf_filename: unimed-clip-vit-b16.pt
    precision: amp
    force_quick_gelu: true
    pretrained_image: false
    in_memory: true
    legacy_checkpoints:
      - unimed-clip-vit-b16.pt
      - unimed_clip_vit_l14_base_text_encoder.pt
      - unimed_clip_vit_l14_large_text_encoder.pt

  CLIP:
    model_name: ViT-L/14@336px
